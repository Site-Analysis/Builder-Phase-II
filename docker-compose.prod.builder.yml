# Production overlay for builder.qnit.site deployment.
# Merge with base: docker compose -f docker-compose.yml -f docker-compose.prod.builder.yml up -d
#
# Changes from dev base:
#   - All host port bindings removed (Caddy routes internally via Docker DNS)
#   - --reload removed from uvicorn commands
#   - CORS_ORIGINS set to https://builder.qnit.site
#   - Keycloak set to production hostname + proxy=edge
#   - Overpass set to OVERPASS_MODE=run (DB assumed already initialised)
#   - Caddy service added (auto TLS via Let's Encrypt)
#   - Data volumes for cadastral, IMD, GEE key read from host paths
#     populated by deploy-builder.sh from S3

services:

  # ── Identity ─────────────────────────────────────────────────────────────────

  keycloak:
    command: start --import-realm
    restart: unless-stopped
    environment:
      KC_HOSTNAME: "https://auth.builder.qnit.site"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports: !reset []

  # ── Reverse proxy ─────────────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile.builder:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - keycloak
      - temperature
      - flood
      - wind
      - rainfall
      - geo
      - planning
      - infrastructure
      - future-infra
      - land-records
      - report
      - cadastral

  # ── Backend services — prod overrides ────────────────────────────────────────
  # All: remove host port bindings, drop --reload, set prod CORS + Keycloak URL.

  temperature:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  sunpath:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      CORS_ORIGINS: '["https://builder.qnit.site"]'
      KEYCLOAK_URL: http://keycloak:8080

  flood:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8002
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  wind:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8003
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  rainfall:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8004
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  geo:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8005
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  planning:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8006
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  infrastructure:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8007
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  future-infra:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8008
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  land-records:
    restart: unless-stopped
    ports: !reset []
    command: opentelemetry-instrument uvicorn app.main:app --host 0.0.0.0 --port 8009
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  report:
    restart: unless-stopped
    ports: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    environment:
      CORS_ORIGINS: https://builder.qnit.site

  cadastral:
    restart: unless-stopped
    ports: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011
    environment:
      CORS_ORIGINS: https://builder.qnit.site
      KEYCLOAK_URL: http://keycloak:8080

  # ── Overpass ─────────────────────────────────────────────────────────────────

  overpass:
    restart: unless-stopped
    ports: !reset []
    environment:
      OVERPASS_MODE: run

  # ── Observability — keep ports off host in prod ──────────────────────────────

  otel-collector:
    restart: unless-stopped
    ports: !reset []

  jaeger:
    restart: unless-stopped
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
