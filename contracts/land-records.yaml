openapi: "3.1.0"
info:
  title: Land Records Service
  version: "1.1.0"
  description: >
    Land-records lookup helper for Karnataka. Portal-only by design: government portals
    (Bhoomi RTC, KAVERI encumbrance, eCourts) require CAPTCHA/session auth and are NOT
    scraped. Returns empty record placeholders plus deep links for the user to verify
    directly, with a completeness score. No automated data retrieval, no synthetic data.

servers:
  - url: http://localhost:8009
    description: Local dev

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service running
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "land-records"

  /land-records/lookup:
    post:
      operationId: lookupLandRecords
      summary: Land-records deep links + placeholders for a survey number
      description: Gated by feature flag `feature.land.records`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandRecordsRequest"
      responses:
        "200":
          description: Land records result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandRecordsResult"
        "403":
          description: Feature flag disabled
        "422":
          description: Validation error

  /land-records/ownership:
    post:
      operationId: ownershipSnapshot
      summary: Ownership SCREENING snapshot — Kharab/restricted flags + deep-links (US-091)
      description: >
        A screening signal ONLY — there is no bulk/public ownership API (Bhoomi RTC, e-Aasthi/
        e-Swathu, Kaveri EC are CAPTCHA/OTP-gated). NO owner is fetched or inferred. Derives Kharab
        (KGIS Cadastral L5; Kharab-B = government land, NON-SALEABLE) and Gomala/restricted
        (Dishaank) flags ONLY when the parcel resolved — otherwise UNRESOLVED (absence of an RTC read
        is NEVER 'clear title'). Emits deep-links (Bhoomi/e-Aasthi/e-Swathu/Kaveri/Dishaank, with the
        exact inputs to type) and an `ownership_feasibility` signal for the US-092 engine. Gated by
        `feature.land.ownership`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnershipRequest"
      responses:
        "200":
          description: Ownership snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipSnapshot"
        "403":
          description: Feature flag disabled
        "422":
          description: Validation error

components:
  schemas:
    Severity:
      type: string
      enum: ["low", "moderate", "high", "none"]

    OwnConfidence:
      type: string
      enum: ["authoritative", "inferred", "unresolved"]
    FlagStatus:
      type: string
      enum: ["resolved", "unresolved", "checklist"]
    OwnershipRequest:
      type: object
      required: [district, taluk, hobli, village, survey_number]
      properties:
        district: { type: string }
        taluk: { type: string }
        hobli: { type: string }
        village: { type: string }
        survey_number: { type: string }
        state: { type: string, default: "Karnataka" }
        parcel_resolved: { type: boolean, default: false }
        cadastral_l5: { type: string, nullable: true }
        dishaank_class: { type: string, nullable: true }
    KharabFlag:
      type: object
      required: [status, source, note]
      properties:
        status: { $ref: "#/components/schemas/FlagStatus" }
        is_kharab: { type: boolean, nullable: true }
        kharab_type: { type: string, nullable: true }
        non_saleable: { type: boolean, nullable: true }
        area_affected: { type: string, nullable: true }
        source: { type: string }
        note: { type: string }
        next_action: { type: string, nullable: true }
    RestrictedFlag:
      type: object
      required: [status, source, note]
      properties:
        status: { $ref: "#/components/schemas/FlagStatus" }
        is_restricted: { type: boolean, nullable: true }
        restriction_type: { type: string, nullable: true }
        source: { type: string }
        note: { type: string }
        next_action: { type: string, nullable: true }
    OwnershipFeasibility:
      type: object
      required: [title_verification, confidence, next_action]
      properties:
        kharab_flag: { type: boolean, nullable: true }
        restricted_flag: { type: boolean, nullable: true }
        title_verification: { type: string, enum: ["manual-required"] }
        confidence: { $ref: "#/components/schemas/OwnConfidence" }
        next_action: { type: string }
    OwnershipSnapshot:
      type: object
      required: [kharab, restricted, ownership_feasibility, data_source]
      properties:
        kharab: { $ref: "#/components/schemas/KharabFlag" }
        restricted: { $ref: "#/components/schemas/RestrictedFlag" }
        ownership_feasibility: { $ref: "#/components/schemas/OwnershipFeasibility" }
        deep_links: { type: array, items: { $ref: "#/components/schemas/DeepLink" } }
        handoff_note: { type: string }
        data_source: { type: string }
        data_disclaimer: { type: string }

    LandRecordsRequest:
      type: object
      required: [district, taluk, hobli, village, survey_number]
      properties:
        district:
          type: string
          example: "Bengaluru Urban"
        taluk:
          type: string
          example: "Bengaluru North"
        hobli:
          type: string
          example: "Jala"
        village:
          type: string
          example: "Yelahanka"
        survey_number:
          type: string
          example: "123/4"
        state:
          type: string
          default: "Karnataka"

    BhoomiRecord:
      type: object
      required: [encumbrance_present, raw_data_available]
      properties:
        owner_name:
          type: string
          nullable: true
        survey_number:
          type: string
          nullable: true
        area_acres:
          type: number
          format: float
          nullable: true
        land_type:
          type: string
          nullable: true
        encumbrance_present:
          type: boolean
        mutation_number:
          type: string
          nullable: true
        raw_data_available:
          type: boolean

    DeepLink:
      type: object
      required: [label, url, description]
      properties:
        label:
          type: string
        url:
          type: string
        description:
          type: string

    CourtCase:
      type: object
      properties:
        case_number:
          type: string
          nullable: true
        court:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        parties:
          type: string
          nullable: true
        filing_date:
          type: string
          nullable: true

    LandRecordsResult:
      type: object
      required: [bhoomi, court_cases, deep_links, score, severity, data_source]
      properties:
        bhoomi:
          $ref: "#/components/schemas/BhoomiRecord"
        court_cases:
          type: array
          items:
            $ref: "#/components/schemas/CourtCase"
        deep_links:
          type: array
          items:
            $ref: "#/components/schemas/DeepLink"
        score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        severity:
          $ref: "#/components/schemas/Severity"
        data_source:
          type: string
        notes:
          type: string
          nullable: true
