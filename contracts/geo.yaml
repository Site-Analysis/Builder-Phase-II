openapi: "3.1.0"
info:
  title: Geo Service
  version: "1.7.0"
  description: >
    Land-use, soil, water-constraint, and amenity analysis for a point. Sources:
    OpenStreetMap (Overpass), ISRO NRSC Bhuvan LULC, and KGIS layers. Zoning is
    OSM-inferred (indicative) unless the KGIS BDA Revised Master Plan land-use layer
    is configured, in which case `zone_class` is authoritative (`zone_authority`
    distinguishes the two). No synthetic data.

servers:
  - url: http://localhost:8005
    description: Local dev

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service running
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: "ok" }
                  service: { type: string, example: "geo" }

  /geo/zone:
    get:
      operationId: getZone
      summary: Land-use / zoning classification for a point
      description: >
        Gated by `feature.zoning.land-use` (KGIS context opt-in via
        `feature.geo.kgis-context`). When the KGIS BDA RMP-2015 land-use layer is
        configured (`KGIS_LANDUSE_URL`) and the point falls inside the BDA Local
        Planning Area, `zone_class` is authoritative (`zone_authority="BDA-RMP-2015"`);
        otherwise it is OSM-inferred (`zone_authority="OSM-inferred"`).
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: float } }
        - { name: lon, in: query, required: true, schema: { type: number, format: float } }
        - { name: radius_m, in: query, required: false, schema: { type: number, format: float, default: 500 } }
      responses:
        "200":
          description: Zone result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResult" }
        "403": { description: Feature flag disabled }
        "422": { description: Validation error }

  /geo/soil:
    get:
      operationId: getSoil
      summary: Soil texture / bearing capacity for a point
      description: Gated by `feature.environment.soil`.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: float } }
        - { name: lon, in: query, required: true, schema: { type: number, format: float } }
      responses:
        "200":
          description: Soil result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoilResult" }
        "403": { description: Feature flag disabled }
        "422": { description: Validation error }

  /geo/water-constraints:
    get:
      operationId: getWaterConstraints
      summary: Water-body buffers / construction setbacks
      description: Gated by `feature.environment.water-constraints`.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: float } }
        - { name: lon, in: query, required: true, schema: { type: number, format: float } }
        - { name: radius_m, in: query, required: false, schema: { type: number, format: float, default: 500 } }
      responses:
        "200":
          description: Water-constraint result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterConstraintResult" }
        "403": { description: Feature flag disabled }
        "422": { description: Validation error }

  /geo/amenities:
    get:
      operationId: getAmenities
      summary: Nearby amenities by category
      description: Gated by `feature.geo.amenities`.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: float } }
        - { name: lon, in: query, required: true, schema: { type: number, format: float } }
        - { name: radius_m, in: query, required: false, schema: { type: number, format: float, default: 5000 } }
      responses:
        "200":
          description: Amenities result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmenitiesResult" }
        "403": { description: Feature flag disabled }
        "422": { description: Validation error }

  /geo/parcel:
    get:
      operationId: getParcel
      summary: Survey-number → cadastral parcel polygon (Karnataka, KGIS)
      description: >
        Forward survey-number lookup. Returns the parcel boundary as a GeoJSON Polygon
        (WGS84) for a Karnataka rural/revenue survey number. Resolution order: explicit
        `kgis_village_id`, else resolved from `village_code` (or from `lat`/`lon` via KGIS
        reverse geocode), then fetched via KGIS `geomForSurveyNum`; if that yields nothing
        a direct KGIS Cadastral-layer query by village code + survey number is tried.
        Gated by `feature.geo.parcel-geometry`. Indicative only — not a legal survey
        (KGIS data may not be used for legal purposes). When nothing resolves the response
        is returned with `resolved=false` and `geometry=null` (no fabrication). See FVD SAT-19.
      parameters:
        - { name: survey_no, in: query, required: true, schema: { type: string } }
        - { name: village_code, in: query, required: false, schema: { type: string, nullable: true } }
        - { name: kgis_village_id, in: query, required: false, schema: { type: string, nullable: true } }
        - { name: lat, in: query, required: false, schema: { type: number, format: float, nullable: true } }
        - { name: lon, in: query, required: false, schema: { type: number, format: float, nullable: true } }
        - { name: crs, in: query, required: false, schema: { type: string, enum: ["DD", "UTM"], default: "DD" } }
      responses:
        "200":
          description: Parcel geometry (or unresolved placeholder)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParcelGeometry" }
        "403": { description: Feature flag disabled }
        "422": { description: Validation error }

  /geo/authority:
    get:
      operationId: getAuthority
      summary: Governing local authority + bye-laws / approval track for a point
      description: >
        Classifies the governing local authority and the applicable building bye-laws /
        approval track from the KGIS admin context, encoding the GBA transition (BBMP
        dissolved 15-May-2025 → Greater Bengaluru Authority). Gated by
        `feature.geo.authority`. The authoritative Boundaries/LPA point-in-polygon check
        is deferred (`live_verified=false`) until KGIS access lands; `authority="Unknown"`
        (low confidence) when context is unavailable. Indicative only — verify before use.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: float } }
        - { name: lon, in: query, required: true, schema: { type: number, format: float } }
      responses:
        "200":
          description: Authority classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorityResult" }
        "403": { description: Feature flag disabled }
        "422": { description: Validation error }

  /geo/overlays:
    get:
      operationId: getOverlays
      summary: Unified deal-killer overlay engine (US-088)
      description: >
        Every deal-killer overlay (rajakaluve, airport-OLS, lakes/waterbodies, wetland, flood,
        forest, HT-line, gas) for a point, with distance in EPSG:32643 (UTM 43N metres), the
        STRICTEST applicable dated buffer regime (range exposed when regimes are in legal flux),
        an R/A/G/unresolved status, reference_point (centre vs periphery), rule citation and
        provenance. CARDINAL RULE — an overlay with no bundled authoritative clearing layer
        returns `unresolved`, never clear: absence of data is NOT absence of hazard. `verdict`
        exposes `hard_no_go` (any RED) and `blocks_clean_go` (any unresolved) for the US-092
        GO/NO-GO engine. Gated by `feature.geo.overlays`. Karnataka-only — lat/lon order and
        bounds are asserted (422 on a swapped/out-of-bounds point).
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: float } }
        - { name: lon, in: query, required: true, schema: { type: number, format: float } }
        - { name: building_height_m, in: query, required: false, schema: { type: number, format: float } }
      responses:
        "200":
          description: Overlay evaluation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverlayResult" }
        "403": { description: Feature flag disabled }
        "422": { description: Feature disabled point out of Karnataka bounds / swapped lat-lon }

components:
  schemas:
    OverlayProvenance:
      type: object
      required: [source, confidence]
      properties:
        source: { type: string }
        confidence: { type: string, enum: ["authoritative", "inferred", "unresolved"] }
        vintage: { type: string, nullable: true }
    OverlayItem:
      type: object
      required: [name, status, as_of, provenance]
      properties:
        name: { type: string }
        status:
          type: string
          enum: ["R", "A", "G", "unresolved"]
          description: >
            R inside strictest buffer / obstacle; A contested-or-less-strict band or
            height-limited OLS surface; G clear (ONLY when a bundled authoritative layer can
            clear it); unresolved no bundled clearing layer — absence is NOT clear.
        distance_m: { type: number, nullable: true, description: "EPSG:32643 metres" }
        buffer_m: { type: number, nullable: true, description: "strictest in-force regime" }
        buffer_range_m:
          type: array
          nullable: true
          items: { type: number }
          description: "[min, max] across regimes when they disagree"
        reference_point: { type: string, nullable: true, enum: ["centre", "periphery"] }
        rule_citation: { type: string, nullable: true }
        effective_date: { type: string, nullable: true }
        litigation_status: { type: string, nullable: true }
        as_of: { type: string }
        provenance: { $ref: "#/components/schemas/OverlayProvenance" }
        reason: { type: string, nullable: true }
        next_action: { type: string, nullable: true }
        crs: { type: string, default: "EPSG:32643" }
    OverlayVerdict:
      type: object
      required: [hard_no_go, blocks_clean_go, red_overlays, unresolved_overlays]
      properties:
        hard_no_go: { type: boolean, description: "any RED overlay" }
        blocks_clean_go: { type: boolean, description: "any unresolved overlay — forces CAUTION" }
        red_overlays: { type: array, items: { type: string } }
        unresolved_overlays: { type: array, items: { type: string } }
    OverlayResult:
      type: object
      required: [lat, lon, overlays, verdict, live_overlays, pending_overlays]
      properties:
        lat: { type: number, format: float }
        lon: { type: number, format: float }
        crs: { type: string, default: "EPSG:32643" }
        overlays:
          type: array
          items: { $ref: "#/components/schemas/OverlayItem" }
        verdict: { $ref: "#/components/schemas/OverlayVerdict" }
        live_overlays: { type: array, items: { type: string } }
        pending_overlays: { type: array, items: { type: string } }
        data_disclaimer: { type: string }
    Severity:
      type: string
      enum: ["low", "moderate", "high", "none"]
    SourceConfidence:
      type: string
      # Unified confidence ladder (matches Provenance.tier + planning FAR). OSM/Bhuvan-derived
      # zoning is ALWAYS "inferred"; only a real RMP/KGIS land-use source may be "authoritative".
      # The old {authoritative, community} vocabulary is removed (US-088 dry-run P0 fix).
      enum: ["authoritative", "derived", "inferred", "unresolved"]
    ZoneClass:
      type: string
      enum: ["Residential", "Commercial", "Industrial", "Agricultural", "Green Belt", "Water Body", "Institutional", "Mixed Use", "Restricted", "Unknown"]
    BearingCapacityClass:
      type: string
      enum: ["Good (>150 kN/m²)", "Moderate (100–150 kN/m²)", "Poor (<100 kN/m²)"]

    NearbyFeature:
      type: object
      required: [type, value, distance_m]
      properties:
        type: { type: string }
        value: { type: string }
        name: { type: string, nullable: true }
        distance_m: { type: number, format: float }
        lat: { type: number, format: float, nullable: true }
        lon: { type: number, format: float, nullable: true }

    KgisContext:
      type: object
      properties:
        type: { type: string, nullable: true }
        district: { type: string, nullable: true }
        town: { type: string, nullable: true }
        admin_zone: { type: string, nullable: true }
        ward: { type: string, nullable: true }
        taluk: { type: string, nullable: true }
        hobli: { type: string, nullable: true }
        village: { type: string, nullable: true }
        village_code: { type: string, nullable: true }
        survey_number: { type: string, nullable: true }

    ZoneResult:
      type: object
      required: [zone_class, primary_landuse, score, severity, data_source]
      properties:
        zone_class: { $ref: "#/components/schemas/ZoneClass" }
        zone_code: { type: string, nullable: true }
        permitted_uses: { type: array, items: { type: string } }
        base_far: { type: number, format: float, nullable: true }
        permissible_ground_coverage: { type: number, format: float, nullable: true }
        primary_landuse: { type: string }
        nearby_features: { type: array, items: { $ref: "#/components/schemas/NearbyFeature" } }
        lulc_class: { type: string, nullable: true }
        lulc_code: { type: integer, nullable: true }
        lulc_vintage: { type: string, nullable: true }
        na_order_required: { type: boolean }
        forest_clearance_required: { type: boolean }
        source_confidence: { $ref: "#/components/schemas/SourceConfidence" }
        zone_authority:
          type: string
          nullable: true
          description: >
            Provenance of `zone_class`: "BDA-RMP-2015" (authoritative BDA Revised
            Master Plan land-use) or "OSM-inferred" (preliminary, from OSM tags).
        kgis:
          oneOf:
            - $ref: "#/components/schemas/KgisContext"
            - type: "null"
        score: { type: number, format: float }
        severity: { $ref: "#/components/schemas/Severity" }
        data_source: { type: string }
        data_disclaimer: { type: string }

    SoilResult:
      type: object
      required: [clay_pct, sand_pct, silt_pct, bulk_density_gcm3, ph, texture_class, bearing_capacity_class, foundation_notes, score, severity, data_source]
      properties:
        clay_pct: { type: number, format: float }
        sand_pct: { type: number, format: float }
        silt_pct: { type: number, format: float }
        bulk_density_gcm3: { type: number, format: float }
        ph: { type: number, format: float }
        texture_class: { type: string }
        bearing_capacity_class: { $ref: "#/components/schemas/BearingCapacityClass" }
        foundation_notes: { type: string }
        score: { type: number, format: float }
        severity: { $ref: "#/components/schemas/Severity" }
        data_source: { type: string }

    WaterBody:
      type: object
      required: [type, distance_m, buffer_zone_m, buffer_source, site_within_buffer]
      properties:
        type: { type: string }
        name: { type: string, nullable: true }
        distance_m: { type: number, format: float }
        buffer_zone_m: { type: number, format: float }
        buffer_source: { type: string }
        site_within_buffer: { type: boolean }

    WaterConstraintResult:
      type: object
      required: [construction_restricted, score, severity, data_source]
      properties:
        water_bodies: { type: array, items: { $ref: "#/components/schemas/WaterBody" } }
        nearest_distance_m: { type: number, format: float, nullable: true }
        construction_restricted: { type: boolean }
        restriction_reason: { type: string, nullable: true }
        score: { type: number, format: float }
        severity: { $ref: "#/components/schemas/Severity" }
        data_source: { type: string }
        data_disclaimer: { type: string }

    AmenityItem:
      type: object
      required: [name, type, distance_m]
      properties:
        name: { type: string }
        type: { type: string }
        distance_m: { type: number, format: float }
        lat: { type: number, format: float, nullable: true }
        lon: { type: number, format: float, nullable: true }

    AmenityCategory:
      type: object
      required: [count, nearest_m]
      properties:
        count: { type: integer }
        nearest_m: { type: number, format: float }
        top_5: { type: array, items: { $ref: "#/components/schemas/AmenityItem" } }
        points: { type: array, items: { $ref: "#/components/schemas/AmenityItem" } }

    AmenitiesResult:
      type: object
      required: [radius_m, healthcare, education, retail, finance, recreation, religious, transport, total_count, score, severity, data_source]
      properties:
        radius_m: { type: number, format: float }
        healthcare: { $ref: "#/components/schemas/AmenityCategory" }
        education: { $ref: "#/components/schemas/AmenityCategory" }
        retail: { $ref: "#/components/schemas/AmenityCategory" }
        finance: { $ref: "#/components/schemas/AmenityCategory" }
        recreation: { $ref: "#/components/schemas/AmenityCategory" }
        religious: { $ref: "#/components/schemas/AmenityCategory" }
        transport: { $ref: "#/components/schemas/AmenityCategory" }
        total_count: { type: integer }
        score: { type: number, format: float }
        severity: { $ref: "#/components/schemas/Severity" }
        data_source: { type: string }

    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: ["Polygon"] }
        coordinates:
          type: array
          description: Array of linear rings; each ring is an array of [lng, lat] pairs (WGS84).
          items:
            type: array
            items: { type: array, items: { type: number, format: float }, minItems: 2 }

    ParcelGeometry:
      type: object
      required: [survey_number, resolved, crs, data_source]
      properties:
        survey_number: { type: string }
        village_code: { type: string, nullable: true }
        kgis_village_id: { type: string, nullable: true }
        ulpin: { type: string, nullable: true }
        lat: { type: number, format: float, nullable: true }
        lon: { type: number, format: float, nullable: true }
        resolved: { type: boolean, description: "true only when a real KGIS polygon was returned" }
        geometry:
          oneOf:
            - $ref: "#/components/schemas/GeoJsonPolygon"
            - type: "null"
        crs: { type: string }
        provenance:
          description: >
            ADDITIVE (optional, nullable). Accuracy-ladder tier/mode for the answer.
            authoritative/kgis-live when a real KGIS polygon resolved; unresolved/unresolved
            on a KGIS miss (there is no vector-parcel fallback — honest degradation, never a
            synthesized boundary). Existing fields are unchanged.
          oneOf:
            - $ref: "#/components/schemas/Provenance"
            - type: "null"
        data_source: { type: string }
        data_disclaimer: { type: string }

    Provenance:
      type: object
      description: >
        Accuracy-ladder provenance (US-080/US-093 fallback wire-in). `tier` is OUR ladder,
        never an upstream label: KGIS-live answers are authoritative; the bundled open-data
        fallback is always inferred; unresolved withholds the value (never a guess).
      required: [tier, mode, data_source]
      properties:
        tier: { type: string, enum: ["authoritative", "inferred", "unresolved"] }
        mode: { type: string, enum: ["kgis-live", "inferred-fallback", "unresolved"] }
        data_source: { type: string }
        data_vintage: { type: string, nullable: true, description: "source snapshot date; null for a live service" }
        reason: { type: string, nullable: true, description: "populated when unresolved" }
        next_action: { type: string, nullable: true, description: "populated when unresolved / needs verification" }

    AuthorityResult:
      type: object
      required: [authority, jurisdiction_type, confidence, live_verified, data_source]
      properties:
        authority: { type: string }
        jurisdiction_type: { type: string, enum: ["Urban", "Rural", "Unknown"] }
        planning_authority: { type: string, nullable: true }
        approval_track: { type: string, nullable: true }
        bye_law_reference: { type: string, nullable: true }
        portal: { type: string, nullable: true }
        confidence: { type: string, enum: ["high", "medium", "low"] }
        live_verified:
          type: boolean
          description: >
            true only once the KGIS Boundaries/LPA point-in-polygon check confirms the
            authority; false while classification is from admin context only.
        kgis:
          oneOf:
            - $ref: "#/components/schemas/KgisContext"
            - type: "null"
        notes: { type: string, nullable: true }
        provenance:
          description: >
            ADDITIVE (optional, nullable). authoritative/kgis-live when classified from KGIS
            context; inferred/inferred-fallback when KGIS is unavailable and the bundled GBA
            wards (2025) or LGD villages (LGD-2024) layer contained the point;
            unresolved/unresolved when neither answered. Existing fields are unchanged.
          oneOf:
            - $ref: "#/components/schemas/Provenance"
            - type: "null"
        data_source: { type: string }
        data_disclaimer: { type: string }
