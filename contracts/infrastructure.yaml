openapi: "3.1.0"
info:
  title: Infrastructure Service
  version: "1.2.0"
  description: >
    Site connectivity analysis from OpenStreetMap. Scores road access, public transit
    proximity, and power infrastructure within a radius. Water/sewage/telecom are
    detected but not scored (OSM India coverage <20%). Live Overpass lookups, no synthetic data.

servers:
  - url: http://localhost:8007
    description: Local dev

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service running
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "infrastructure"

  /infrastructure/analyze:
    post:
      operationId: analyzeInfrastructure
      summary: Connectivity (road / transit / power) for a location
      description: Gated by feature flag `feature.infrastructure.connectivity`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfraRequest"
      responses:
        "200":
          description: Infrastructure result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfraResult"
        "403":
          description: Feature flag disabled
        "422":
          description: Validation error

  /infrastructure/utilities:
    post:
      operationId: analyzeUtilities
      summary: Utilities availability + NOC checklist + infra_readiness (US-087)
      description: >
        Water/telecom AVAILABILITY as an inferred OSM proximity proxy (never a connection claim);
        BWSSB water/sewer trunk-main presence at AUTHORITATIVE confidence only (an official
        BWSSB/KGIS mains layer) — otherwise `unknown` + "verify with BWSSB" (OSM cannot assert a
        main exists). A structured NOC checklist of mandatory obligations (BWSSB, BESCOM/CEA-2010,
        KSPCB CTE/CTO, Fire per RMP reg 3.12, AAI NOCAS, PNGRB gas, telecom RoW), each with its
        authority + rule citation + typical validity + deep link. Emits `infra_readiness` for the
        US-092 GO/NO-GO engine. Gated by `feature.infrastructure.utilities`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfraRequest"
      responses:
        "200":
          description: Utilities + NOC checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilitiesResult"
        "403":
          description: Feature flag disabled
        "422":
          description: Validation error

  /infrastructure/connectivity:
    post:
      operationId: analyzeConnectivity
      summary: Connectivity — airport/metro/rail/highway distance + access road (US-086)
      description: >
        The connectivity OWNER (airport distance consolidated OUT of planning, which keeps only the
        ICAO height cap). Airport distance is STRAIGHT-LINE in EPSG:32643 from the bundled AAI ARP;
        metro/rail/highway resolve only from real sources and return `unresolved` when a source is
        not fetchable (never a fabricated distance); every distance is labelled straight-line vs
        network. Access-road width comes from the planning road_width_resolver (reused, not
        reimplemented). Emits `connectivity_signal` + access flags for the US-092 GO/NO-GO engine.
        Gated by `feature.infrastructure.connectivity`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectivityRequest"
      responses:
        "200":
          description: Connectivity result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectivityResult"
        "403":
          description: Feature flag disabled
        "422":
          description: Validation error

components:
  schemas:
    ConnectivityRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        radius_m: { type: number, format: float, default: 2000 }
        surveyed_width_m: { type: number, format: float, nullable: true }
        measured_width_m: { type: number, format: float, nullable: true }
        lane_count: { type: integer, nullable: true }
    TransportDistance:
      type: object
      required: [mode, status, confidence]
      properties:
        mode: { type: string }
        status: { type: string, enum: ["resolved", "unresolved"] }
        name: { type: string, nullable: true }
        ref: { type: string, nullable: true }
        distance_m: { type: number, format: float, nullable: true }
        distance_type: { type: string, nullable: true, enum: ["straight-line", "network"] }
        confidence: { $ref: "#/components/schemas/UtilityConfidence" }
        crs: { type: string, default: "EPSG:32643" }
        data_source: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        next_action: { type: string, nullable: true }
    RoadWidthConn:
      type: object
      required: [status, confidence]
      properties:
        status: { type: string, enum: ["resolved", "unresolved"] }
        value_m: { type: number, format: float, nullable: true }
        band: { type: object, nullable: true }
        confidence: { type: string }
        source: { type: string }
        reason: { type: string, nullable: true }
        next_action: { type: string, nullable: true }
    ConnectivitySignal:
      type: object
      required: [metro_status, overall]
      properties:
        airport_km: { type: number, format: float, nullable: true }
        airport_distance_type: { type: string, nullable: true }
        metro_status: { type: string, enum: ["resolved", "unresolved"] }
        road_width_confidence: { type: string, nullable: true }
        access_flags: { type: array, items: { type: string } }
        overall: { type: string, enum: ["good", "partial", "unknown"] }
        notes: { type: array, items: { type: string } }
    ConnectivityResult:
      type: object
      required: [airport, metro, rail, highway, road_width, connectivity_score, connectivity_signal, data_source]
      properties:
        airport: { $ref: "#/components/schemas/TransportDistance" }
        metro: { $ref: "#/components/schemas/TransportDistance" }
        rail: { $ref: "#/components/schemas/TransportDistance" }
        highway: { $ref: "#/components/schemas/TransportDistance" }
        road_width: { $ref: "#/components/schemas/RoadWidthConn" }
        connectivity_score: { type: number, format: float }
        access_flags: { type: array, items: { type: string } }
        connectivity_signal: { $ref: "#/components/schemas/ConnectivitySignal" }
        data_source: { type: string }
        data_disclaimer: { type: string }
    UtilityConfidence:
      type: string
      enum: ["authoritative", "inferred", "unresolved"]
    Presence:
      type: string
      enum: ["present", "absent", "unknown"]
    UtilityMain:
      type: object
      required: [name, present, confidence]
      properties:
        name: { type: string }
        present: { $ref: "#/components/schemas/Presence" }
        confidence: { $ref: "#/components/schemas/UtilityConfidence" }
        distance_m: { type: number, format: float, nullable: true }
        diameter_mm: { type: number, format: float, nullable: true }
        data_source: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        next_action: { type: string, nullable: true }
    UtilityAvailability:
      type: object
      required: [name, score, confidence]
      properties:
        name: { type: string }
        score: { type: number, format: float }
        confidence: { $ref: "#/components/schemas/UtilityConfidence" }
        nearest_m: { type: number, format: float, nullable: true }
        detected: { type: boolean }
        note: { type: string, nullable: true }
    NocChecklistItem:
      type: object
      required: [authority, requirement, rule_citation]
      properties:
        authority: { type: string }
        requirement: { type: string }
        rule_citation: { type: string }
        typical_validity: { type: string, nullable: true }
        deep_link: { type: string, nullable: true }
        applies_when: { type: string, nullable: true }
        mandatory: { type: boolean, default: true }
    InfraReadiness:
      type: object
      required: [water_status, water_confidence, telecom_score, noc_pending, overall]
      properties:
        water_status: { $ref: "#/components/schemas/Presence" }
        water_confidence: { $ref: "#/components/schemas/UtilityConfidence" }
        telecom_score: { type: number, format: float }
        power_score: { type: number, format: float, nullable: true }
        road_score: { type: number, format: float, nullable: true }
        noc_pending: { type: integer }
        overall: { type: string, enum: ["ready", "partial", "unknown"] }
        notes: { type: array, items: { type: string } }
    UtilitiesResult:
      type: object
      required: [water_main, sewer_main, water_availability, telecom_availability, storm_water_note, noc_checklist, infra_readiness, data_source]
      properties:
        water_main: { $ref: "#/components/schemas/UtilityMain" }
        sewer_main: { $ref: "#/components/schemas/UtilityMain" }
        water_availability: { $ref: "#/components/schemas/UtilityAvailability" }
        telecom_availability: { $ref: "#/components/schemas/UtilityAvailability" }
        storm_water_note: { type: string }
        noc_checklist: { type: array, items: { $ref: "#/components/schemas/NocChecklistItem" } }
        infra_readiness: { $ref: "#/components/schemas/InfraReadiness" }
        data_source: { type: string }
        data_disclaimer: { type: string }
    Severity:
      type: string
      enum: ["low", "moderate", "high", "none"]

    TransitType:
      type: string
      enum: ["metro", "railway", "bus"]

    InfraRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        radius_m:
          type: number
          format: float
          minimum: 0
          default: 2000

    RoadAccess:
      type: object
      required: [nearest_road_m, frontage_present]
      properties:
        nearest_road_m:
          type: number
          format: float
        road_type:
          type: string
          nullable: true
        road_name:
          type: string
          nullable: true
        road_ref:
          type: string
          nullable: true
        road_surface:
          type: string
          nullable: true
        road_lanes:
          type: integer
          nullable: true
        road_width_m:
          type: number
          format: float
          nullable: true
        road_maxspeed_kmh:
          type: integer
          nullable: true
        frontage_present:
          type: boolean

    TransitStop:
      type: object
      required: [type, distance_m]
      properties:
        type:
          $ref: "#/components/schemas/TransitType"
        name:
          type: string
          nullable: true
        distance_m:
          type: number
          format: float
        line:
          type: string
          nullable: true

    UtilityPresence:
      type: object
      required:
        [water_supply_nearby, power_substation_nearby, storm_drainage_nearby, sewage_works_nearby]
      properties:
        water_supply_nearby:
          type: boolean
        power_substation_nearby:
          type: boolean
        power_line_nearby:
          type: boolean
        power_line_voltage_kv:
          type: number
          format: float
          nullable: true
        power_line_distance_m:
          type: number
          format: float
          nullable: true
        storm_drainage_nearby:
          type: boolean
        sewage_works_nearby:
          type: boolean
        telecom_tower_nearby:
          type: boolean
        telecom_tower_distance_m:
          type: number
          format: float
          nullable: true

    InfraSubScores:
      type: object
      required: [road, transit, power, water, telecom]
      properties:
        road:
          type: number
          format: float
        transit:
          type: number
          format: float
        power:
          type: number
          format: float
        water:
          type: number
          format: float
        telecom:
          type: number
          format: float

    InfraResult:
      type: object
      required: [utilities, sub_scores, score, severity, data_source]
      properties:
        road_access:
          oneOf:
            - $ref: "#/components/schemas/RoadAccess"
            - type: "null"
        transit:
          type: array
          items:
            $ref: "#/components/schemas/TransitStop"
        utilities:
          $ref: "#/components/schemas/UtilityPresence"
        sub_scores:
          $ref: "#/components/schemas/InfraSubScores"
        score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        severity:
          $ref: "#/components/schemas/Severity"
        data_source:
          type: string
        data_disclaimer:
          type: string
